<text x="96" y="1918" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Per-name means span 0.3588–0.3775 (spread 0.0188). The White − Black gap is −0.0041 — the opposite direction of the original</text>
<text x="96" y="1952" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">single-résumé test, which reported a +0.0189 gap favoring White-associated names.</text>
<text x="96" y="1986" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Binary interview decisions showed no name differences: exactly 25.0% of candidates advanced in every group.</text>
<text x="96" y="2020" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Names from established résumé-audit research (Kline, Rose and Walters, building on Bertrand and Mullainathan).</text>
