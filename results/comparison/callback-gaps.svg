<text x="96" y="1900" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">(exactly 0.0pp at every threshold); GPT-5.6 Sol is the noisiest screener (widest CIs). Gender gaps hug zero for every model.</text>
<text x="96" y="1934" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Model estimates: this benchmark's cluster-bootstrap CIs; audit reference: published point estimate (white 9.65% vs Black 6.45% callback rates).</text>
