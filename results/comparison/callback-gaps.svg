<text x="96" y="1832" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Every model sits on the opposite side of zero from the human audit reference: Bertrand and Mullainathan (2004) found White-associated</text>
<text x="96" y="1866" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">names received ~50% more callbacks (+3.2pp), while all five models here favor Black-associated names, most on binary decisions.</text>
<text x="96" y="1900" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Jev's binary decisions are perfectly determined by résumé quality (0.0pp at every threshold); GPT-5.6 Sol is the noisiest screener (widest CIs).</text>
<text x="96" y="1934" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Model estimates: this benchmark's cluster-bootstrap CIs; audit reference: published point estimate (white 9.65% vs Black 6.45% callback rates).</text>
