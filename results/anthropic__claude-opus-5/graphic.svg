<text x="96" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#17171c">Claude Opus 5 résumé-screen test</text>
<text x="96" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#5f6672">Same 8 résumés and job posting for every name. Only the applicant's first name changed.</text>
<text x="96" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#5f6672">76 names, 19 in each race × sex group. 608 independent evaluations — every résumé screened on its own.</text>
