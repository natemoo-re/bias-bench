<text x="1421" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#5f6672" text-anchor="end">advance = score ≥ 0.50</text>
<text x="96" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Each cell = 19 evaluations (19 names) of one résumé for one name group. Fill opacity = share that advanced.</text>
