<text x="690" y="1244" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#17171c" text-anchor="end">−0.0271</text>
<line x1="780" y1="1022" x2="780" y2="1292" stroke="#ccd2da" stroke-width="1.5"/>
<text x="820" y="1120" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17171c"><tspan font-weight="bold" fill="#2159a5">3 of 38</tspan> White-associated names</text>
<text x="820" y="1164" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17171c">scored above the 76-name average.</text>
<text x="820" y="1248" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17171c"><tspan font-weight="bold" fill="#bf571d">31 of 38</tspan> Black-associated names did.</text>
<line x1="96" y1="1324" x2="1477" y2="1324" stroke="#ccd2da" stroke-width="1.5"/>
<text x="96" y="1366" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Per-name means span 0.3675–0.4487 (spread 0.0812). The White − Black gap is −0.0271 — the opposite direction of the original</text>
<text x="96" y="1400" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">single-résumé test, which reported a +0.0189 gap favoring White-associated names.</text>
<text x="96" y="1434" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Binary interview decisions varied little with names: advance rates ranged from 48% to 50% across groups (50% overall).</text>
<text x="96" y="1468" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f6672">Names from established résumé-audit research (Kline, Rose and Walters, building on Bertrand and Mullainathan).</text>
</svg>
